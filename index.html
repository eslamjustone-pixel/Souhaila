<!DOCTYPE html><html lang="en">
  <link rel="stylesheet" href="style.css">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Souhaila ❤️</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffd6e7);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #4a2433;
    }

    .container {
      width: 92%;
      max-width: 500px;
      text-align: center;
      padding: 40px 25px;
      background: rgba(255,255,255,0.75);
      border-radius: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
      backdrop-filter: blur(10px);
    }

    .heart {
      font-size: 70px;
      animation: beat 1.3s infinite;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .date {
      font-size: 15px;
      opacity: 0.7;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      background: #e75480;
      color: white;
      font-size: 17px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #message {
      display: none;
      margin-top: 25px;
      font-size: 17px;
      line-height: 1.8;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }
  </style></head><body>  <div class="container"><div class="heart">❤️</div>

<h1>Souhaila</h1>

<p>
  إلى أجمل واحدة في حياتي...
  وجودك في حياتي خلّى لكل حاجة معنى أجمل ❤️
</p>

<div class="date">
  Our story started — 3/7/2026
</div>

<button onclick="showMessage()">
  اضغطي هنا ❤️
</button>

<div id="message">
  مهما كتبت ومهما حاولت أوصف،
  مش هقدر أوصف مكانتك عندي.
  ربنا يخليكي ليا ونفضل دايمًا مع بعض ❤️
</div>

  </div>  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";
    }
  </script></body>
</html>
