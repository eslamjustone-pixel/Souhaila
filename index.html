<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Souhaila ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #180812, #4a1730);
      color: white;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 400px;
      padding: 40px 25px;
      border-radius: 30px;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(15px);
    }

    .heart {
      font-size: 70px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 15px;
    }

    p {
      color: #ffd7e5;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 25px;
      text-align: center;
      font-size: 18px;
      margin-bottom: 15px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 25px;
      background: #e75480;
      color: white;
      font-size: 18px;
    }

    #error {
      display: none;
      margin-top: 15px;
      color: #ff9ab8;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="heart">❤️</div>

    <h1>Souhaila</h1>

    <p>المكان ده معمول مخصوص ليكي ❤️</p>

    <input
      type="password"
      id="password"
      placeholder="اكتبي الباسورد">

    <button onclick="login()">
      دخول ❤️
    </button>

    <div id="error">
      الباسورد غلط ❤️
    </div>

  </div>

  <script>
    function login() {

      let password =
        document.getElementById("password").value;

      if (password === "1872026") {

        window.location.href = "home.html";

      } else {

        document.getElementById("error").style.display = "block";

      }
    }
  </script>

</body>
</html>
